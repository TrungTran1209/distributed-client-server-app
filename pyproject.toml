[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-client-server-app"
version = "0.1.0"
description = "Collaborative distributed client-server application"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
desktop = ["PySide6>=6.5", "cryptography>=41"]
test = ["pytest>=7", "pytest-cov>=4"]

[project.gui-scripts]
collab-gui = "collab.gui.__main__:main"

